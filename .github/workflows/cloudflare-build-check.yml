name: Cloudflare deployment build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        env:
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
        run: |
          test -n "$NEXT_PUBLIC_GTM_ID" || { echo 'Missing NEXT_PUBLIC_GTM_ID repository variable'; exit 1; }
          npm run build
          test -f out/index.html
          test -f functions/api/submit.js
